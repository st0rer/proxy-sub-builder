# Конфигурация singbox-client для KeeneticOS 5 (Entware)

# URL подписки (v2ray.txt base64 или nodes.txt)
SUB_URL="https://raw.githubusercontent.com/st0rer/proxy-sub/main/v2ray.txt"
# Резервный URL подписки (например http://192.168.1.100:8899/yota.txt)
FALLBACK_URL=""

# Режим работы: "tun" или "tproxy"
MODE="tun"

# Параметры TUN интерфейса
TUN_DEV="sb0"
TUN_MTU="1200"
TUN_ADDR="172.19.0.1/30"
TABLE_ID="200"
FWMARK="0x54554e"

# Параметры TProxy (если MODE="tproxy")
TPROXY_PORT="12345"

# Фильтрация нод
EXCLUDE_CC="RU"
REQUIRE_GEMINI="1"
STRICT_MODE="1"
MIN_NODES="4"

# Автообновление
AUTO_REFRESH="1"
REFRESH_CRON="17 5 * * *"
CF_WATCHDOG="1"
WATCHDOG_CRON="*/15 * * * *"

# Своя Cloudflare-нода (опционально)
CF_NODE_FILE="/opt/etc/sing-box/cf_node.json"
